<script>/* Lien universel « hmgfitness.fr/salle/?id=lognes » : l'appli ouvre la fiche ; ici, le site l'ouvre avec « /#lognes ». */
(function(){
  var q=new URLSearchParams(location.search), id=(q.get("id")||location.hash.replace(/^#/,"")||"").toLowerCase();
  location.replace(/^[a-z0-9-]{1,80}$/.test(id)?"/#"+id:"/");
})();</script>
