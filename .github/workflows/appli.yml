# Fabrique l'appli HMG Fitness pour Android et iPhone (gratuit, sur les serveurs GitHub), pour les tests.
# Tout le code du site est embarqué dans l'appli (app/build-www.js) : seules les données passent par Internet.
# Résultat : https://github.com/Germino-py/fitness-park/releases/tag/appli
# La version iPhone SIGNÉE, pour TestFlight et l'App Store, est fabriquée par ios-testflight.yml (lancement à la main).
name: Appli Android + iPhone

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    # l'appli embarque le site : elle est refaite quand l'appli OU le site changent
    paths: ["app/**", "index.html", "css/**", "js/**", "fonts/**", "icons/**", ".github/workflows/appli.yml"]

permissions:
  contents: write

concurrency:
  group: appli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Préparer le projet Android (contenu embarqué, icônes, autorisations, liens)
        working-directory: app
        run: |
          set -euo pipefail
          npm ci
          npm run android                   # www (build-www.js) + cap add android + icônes + native-setup.js android + cap sync android
      - name: Construire l'APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp app/android/app/build/outputs/apk/debug/app-debug.apk HMG-Fitness.apk
      - uses: actions/upload-artifact@v4
        with: { name: HMG-Fitness-android, path: HMG-Fitness.apk }

  ios:
    name: iPhone (IPA non signée + simulateur)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Préparer le projet iPhone (contenu embarqué, icônes, Info.plist, confidentialité, réglages Xcode)
        working-directory: app
        run: |
          set -euo pipefail
          npm ci
          npm run ios                       # www (build-www.js) + cap add ios + icônes + native-setup.js ios + cap sync ios
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER)) ruby ios-setup.rb   # sans TEAM_ID : iPhone seul, version, PrivacyInfo, pas de signature
      - name: Construire pour iPhone (non signée) et pour le simulateur
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/HMG-Fitness-iPhone-non-signee.ipa" Payload
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | tail -20
          cd simbuild/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/HMG-Fitness-simulateur-iPhone.zip" App.app
      # Essai sur un vrai simulateur d'iPhone (le WebKit d'iOS) : captures d'écran et erreurs JavaScript de l'appli.
      # 1. premier lancement (accueil des nouveaux), photographié à 4, 10, 20 et 40 s ; 2. héros déjà créé (Aventure).
      # Le journal de la console JavaScript n'existe que dans la version Debug (loggingBehavior « debug »).
      - name: Essai dans le simulateur d'iPhone
        continue-on-error: true
        working-directory: app/ios/App
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/essai"; mkdir -p "$OUT"; APP=simbuild/Build/Products/Debug-iphonesimulator/App.app; ID=fr.hmgfitness.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]; print(c[-1]['udid'] if c else '')")
          [ -n "$UDID" ] || { echo "aucun simulateur d'iPhone"; exit 1; }
          xcrun simctl list devices | grep "$UDID" | tee "$OUT/appareil.txt"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl location "$UDID" set 48.8354,2.6300 || true
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'process == "App"' > "$OUT/journal.txt" 2>&1 &
          LOG=$!
          xcrun simctl install "$UDID" "$APP"; xcrun simctl privacy "$UDID" grant location "$ID" || true
          xcrun simctl launch --stdout="$OUT/sortie-1.txt" --stderr="$OUT/sortie-1.txt" "$UDID" "$ID"; T=0
          for t in 4 10 20 40; do sleep $((t-T)); T=$t; xcrun simctl io "$UDID" screenshot "$OUT/1-premier-lancement-${t}s.png"; done
          xcrun simctl terminate "$UDID" "$ID" || true; xcrun simctl uninstall "$UDID" "$ID"; xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$ID" || true
          # Preferences de Capacitor (UserDefaults de l'appli, lues par le simulateur hors du conteneur) : héros déjà créé
          D() { xcrun simctl spawn "$UDID" defaults write "$ID" "CapacitorStorage.$1" -string "$2"; }
          D hmg-onb '{"done":true}'; D hmg-sound 'false'; D hmg-pseudo-later 'true'
          D hmg-game '{"seen":0,"open":[0],"items":["haltere"],"stars":0,"eq":{"hero":"homme","tone":"clair"},"leg":{}}'
          xcrun simctl spawn "$UDID" defaults read "$ID" > "$OUT/preferences.txt" 2>&1 || true
          xcrun simctl launch --stdout="$OUT/sortie-2.txt" --stderr="$OUT/sortie-2.txt" "$UDID" "$ID"; sleep 12; xcrun simctl io "$UDID" screenshot "$OUT/2-aventure.png"
          sleep 15; xcrun simctl io "$UDID" screenshot "$OUT/3-aventure-27s.png"
          kill $LOG || true; sleep 1
          cat "$OUT"/sortie-*.txt 2>/dev/null | grep -v "To Native" | head -600 > "$OUT/console.txt" || true   # console JavaScript (Capacitor, version Debug)
          grep -E "\[(error|warn)\]|Error|Exception" "$OUT/console.txt" | head -200 > "$OUT/erreurs.txt" || true
          echo "Lignes du journal : $(wc -l < "$OUT/journal.txt") · console JavaScript : $(wc -l < "$OUT/console.txt") · erreurs : $(wc -l < "$OUT/erreurs.txt")"
          grep -E "\[error\]|Error|Exception" "$OUT/erreurs.txt" | head -40 || true
          cd "$OUT" && zip -qry "$GITHUB_WORKSPACE/HMG-Fitness-essai-iPhone.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: HMG-Fitness-iphone
          path: |
            HMG-Fitness-iPhone-non-signee.ipa
            HMG-Fitness-simulateur-iPhone.zip
            HMG-Fitness-essai-iPhone.zip
          if-no-files-found: warn

  publier:
    name: Mettre en téléchargement
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publier sur la page « appli »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          NOTES="Appli HMG Fitness, construite le $(date -u +'%d/%m/%Y à %H:%M') UTC (version de test).

          • Android : télécharge HMG-Fitness.apk sur le téléphone, ouvre-le et autorise l'installation.
          • iPhone : la vraie appli arrive par TestFlight, puis par l'App Store. HMG-Fitness-iPhone-non-signee.ipa sert aux tests (à signer soi-même) ; HMG-Fitness-simulateur-iPhone.zip s'ouvre dans un simulateur d'iPhone.

          Tout le code de l'appli est dedans : seules les données (séances, avis, classement) passent par Internet. Pour avoir la dernière version, réinstalle l'appli depuis cette page."
          gh release view appli >/dev/null 2>&1 || gh release create appli --title "Appli HMG Fitness" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release edit appli --notes "$NOTES"
          gh release upload appli out/* --clobber
